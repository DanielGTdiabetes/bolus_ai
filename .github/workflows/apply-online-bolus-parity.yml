name: Apply online bolus settings parity

on:
  push:
    branches:
      - fix/online-bolus-settings-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/online-bolus-settings-parity
          fetch-depth: 0
      - name: Centralize online dosing configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Request model: omitted Autosens means use saved backend setting.
          path = Path('backend/app/models/bolus_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '    enable_autosens: bool = Field(default=True, description="Enable Autosens (Dynamic ISF/ICR)")\n'
          new = '    enable_autosens: Optional[bool] = Field(default=None, description="Optional per-request Autosens override; None uses saved user setting")\n'
          if old not in text:
              raise SystemExit('enable_autosens model anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2) Backend service: apply only an explicit request override after settings resolution.
          path = Path('backend/app/services/bolus_calc_service.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''        if not user_settings:\n            user_settings = store.load_settings()\n\n    # 2. Resolve Nightscout Client\n'''
          replacement = '''        if not user_settings:\n            user_settings = store.load_settings()\n\n    # A per-request Autosens flag is an explicit override only. If omitted,\n    # preserve the user's authoritative saved backend configuration.\n    if payload.enable_autosens is not None:\n        user_settings.autosens.enabled = payload.enable_autosens\n\n    # 2. Resolve Nightscout Client\n'''
          if anchor not in text:
              raise SystemExit('settings resolution anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          # 3) Sick-mode helper: it is context-only and no longer requires browser copies of ratios.
          path = Path('frontend/src/lib/sickModePolicy.js')
          text = path.read_text(encoding='utf-8')
          old = '''export function resolveSickModeDosingPolicy({ icr, isf, isSick = false }) {\n  const resolvedIcr = finitePositive(icr, 'ICR');\n  const resolvedIsf = finitePositive(isf, 'ISF');\n\n  return {\n    icr: resolvedIcr,\n    isf: resolvedIsf,\n    active: Boolean(isSick),\n    automaticDoseAdjustment: false,\n    warning: isSick\n      ? 'Modo Enfermedad activo: ajuste automático de dosis desactivado; se usan los ratios configurados.'\n      : null,\n  };\n}\n'''
          new = '''export function resolveSickModeDosingPolicy({ icr, isf, isSick = false } = {}) {\n  const policy = {\n    active: Boolean(isSick),\n    automaticDoseAdjustment: false,\n    warning: isSick\n      ? 'Modo Enfermedad activo: ajuste automático de dosis desactivado; se usan los ratios configurados.'\n      : null,\n  };\n\n  // Backward-compatible validation for callers/tests that provide ratios.\n  // Online dosing no longer needs browser copies of these values.\n  if (icr != null) policy.icr = finitePositive(icr, 'ICR');\n  if (isf != null) policy.isf = finitePositive(isf, 'ISF');\n  return policy;\n}\n'''
          if old not in text:
              raise SystemExit('sick policy anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4) Online hook: stop injecting persistent dosing settings from the browser.
          path = Path('frontend/src/hooks/useBolusCalculator.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''import {\n    getCalcParams,\n    getSplitSettings,\n    state,\n    saveDualPlan\n} from '../modules/core/store';\n''', '''import {\n    getSplitSettings,\n    state,\n    saveDualPlan\n} from '../modules/core/store';\n''', 1)
          import_anchor = "import { resolveSickModeDosingPolicy } from '../lib/sickModePolicy';\n"
          if import_anchor not in text:
              raise SystemExit('sick policy import anchor not found')
          text = text.replace(import_anchor, import_anchor + "import { buildOnlineBolusPayload } from '../lib/onlineBolusPayload';\n", 1)

          old_settings = '''            const mealParams = getCalcParams();\n            if (!mealParams) throw new Error("No hay configuración de ratios.");\n\n'''
          if old_settings not in text:
              raise SystemExit('getCalcParams block not found')
          text = text.replace(old_settings, '', 1)

          old_slot_sick = '''            const slotParams = mealParams[slot];\n            if (!slotParams?.icr || !slotParams?.isf || !slotParams?.target) {\n                throw new Error(`Faltan datos para el horario '${slot}'.`);\n            }\n\n            // Sick mode is context-only until an explicit policy exists in the\n            // authoritative backend engine. The frontend must never alter ICR/ISF.\n            const isSick = localStorage.getItem('sick_mode_enabled') === 'true';\n            const sickModePolicy = resolveSickModeDosingPolicy({\n                icr: slotParams.icr,\n                isf: slotParams.isf,\n                isSick,\n            });\n            const finalIcr = sickModePolicy.icr;\n            const finalIsf = sickModePolicy.isf;\n\n            const payload = {\n                carbs_g: correctionOnly ? 0 : carbsVal,\n                fat_g: correctionOnly ? 0 : fatVal,\n                protein_g: correctionOnly ? 0 : proteinVal,\n                fiber_g: (correctionOnly) ? 0 : (fiberVal || 0),\n                bg_mgdl: isNaN(bgVal) ? null : bgVal,\n                meal_slot: slot,\n                target_mgdl: slotParams.target,\n                carb_profile: carbProfile ?? null,\n                cr_g_per_u: finalIcr,\n                isf_mgdl_per_u: finalIsf,\n                dia_hours: mealParams.dia_hours || 4.0,\n                insulin_model: mealParams.insulin_model || 'walsh',\n                insulin_peak_minutes: mealParams.insulin_peak_minutes\n                    ?? (mealParams.insulin_model === 'fiasp' ? 55 : 75),\n                round_step_u: mealParams.round_step_u || 0.5,\n                max_bolus_u: mealParams.max_bolus_u || 15,\n                warsaw_safety_factor: mealParams.warsaw?.safety_factor,\n                warsaw_safety_factor_dual: mealParams.warsaw?.safety_factor_dual,\n                warsaw_trigger_threshold_kcal: mealParams.warsaw?.trigger_threshold_kcal,\n                use_fiber_deduction: mealParams.calculator?.subtract_fiber,\n                fiber_factor: mealParams.calculator?.fiber_factor,\n                fiber_threshold: mealParams.calculator?.fiber_threshold_g,\n                alcohol: alcoholEnabled,\n                exercise: exercise || { planned: false, minutes: 0, intensity: 'moderate' },\n                // SC-Compat: Use override if explicit > Use Settings > Default False (Strict User Control)\n                enable_autosens: overrideParams?.useAutosens !== undefined\n                    ? overrideParams.useAutosens\n                    : (mealParams.autosens?.enabled || false),\n                autosens_ratio: (overrideParams?.useAutosens ? (state.autosens?.ratio || 1.0) : 1.0),\n                autosens_reason: state.autosens?.reason || null\n            };\n'''
          new_slot_sick = '''            // Online calculations use backend settings as the single source of truth.\n            // Sick mode remains context-only and does not alter browser-side ratios.\n            const isSick = localStorage.getItem('sick_mode_enabled') === 'true';\n            const sickModePolicy = resolveSickModeDosingPolicy({ isSick });\n\n            const payload = buildOnlineBolusPayload({\n                carbsG: correctionOnly ? 0 : carbsVal,\n                fatG: correctionOnly ? 0 : fatVal,\n                proteinG: correctionOnly ? 0 : proteinVal,\n                fiberG: correctionOnly ? 0 : (fiberVal || 0),\n                bgMgdl: isNaN(bgVal) ? null : bgVal,\n                mealSlot: slot,\n                carbProfile,\n                alcohol: alcoholEnabled,\n                exercise: exercise || { planned: false, minutes: 0, intensity: 'moderate' },\n                autosensOverride: overrideParams?.useAutosens,\n            });\n'''
          if old_slot_sick not in text:
              raise SystemExit('legacy online settings payload block not found')
          text = text.replace(old_slot_sick, new_slot_sick, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-online-bolus-parity.yml
          git add backend/app/models/bolus_v2.py backend/app/services/bolus_calc_service.py frontend/src/lib/sickModePolicy.js frontend/src/hooks/useBolusCalculator.js
          git commit -m "Use backend settings for online bolus calculations"
          git push origin HEAD:fix/online-bolus-settings-parity
