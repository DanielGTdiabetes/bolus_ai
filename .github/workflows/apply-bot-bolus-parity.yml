name: Apply bot bolus parity fix

on:
  push:
    branches:
      - fix/bot-bolus-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-bolus-parity
          fetch-depth: 0
      - name: Patch Telegram bolus tools
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/bot/tools.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''async def _load_user_settings(username: Optional[str] = None) -> UserSettings:\n    \"\"\"Load user settings using the shared resolver to avoid default/admin drift.\"\"\"\n    resolved_settings, resolved_user = await resolve_bot_user_settings(username)\n    logger.info(\"Tools module using settings for user_id='%s'\", resolved_user)\n    return resolved_settings\n\n\n'''
          helper = anchor + '''def _resolve_meal_slot(user_settings: UserSettings, meal_type: Optional[str] = None) -> str:\n    \"\"\"Resolve the current meal slot once for all bot dosing paths.\"\"\"\n    if meal_type:\n        if meal_type not in {\"breakfast\", \"lunch\", \"dinner\", \"snack\"}:\n            raise ValueError(f\"Horario de comida no válido: {meal_type}\")\n        return meal_type\n\n    from app.utils.timezone import to_local\n\n    now_local = to_local(datetime.now(timezone.utc))\n    h = now_local.hour\n    sch = user_settings.schedule\n    if sch.breakfast_start_hour <= h < sch.lunch_start_hour:\n        return \"breakfast\"\n    if sch.lunch_start_hour <= h < sch.dinner_start_hour:\n        return \"lunch\"\n    if h >= sch.dinner_start_hour or h < sch.breakfast_start_hour:\n        return \"dinner\"\n    return \"snack\"\n\n\n'''
          if anchor not in text:
              raise SystemExit('settings helper anchor not found')
          text = text.replace(anchor, helper, 1)

          slot_old = '''    if meal_type:\n        meal_slot = meal_type\n    else:\n        from app.utils.timezone import to_local\n\n        now_local = to_local(datetime.now(timezone.utc))\n        h = now_local.hour\n        sch = user_settings.schedule\n\n        if sch.breakfast_start_hour <= h < sch.lunch_start_hour:\n            meal_slot = \"breakfast\"\n        elif sch.lunch_start_hour <= h < sch.dinner_start_hour:\n            meal_slot = \"lunch\"\n        elif h >= sch.dinner_start_hour or h < sch.breakfast_start_hour:\n            meal_slot = \"dinner\"\n        else:\n            meal_slot = \"snack\"\n\n'''
          slot_new = '''    try:\n        meal_slot = _resolve_meal_slot(user_settings, meal_type)\n    except ValueError as exc:\n        return ToolError(type=\"validation_error\", message=str(exc))\n\n'''
          if slot_old not in text:
              raise SystemExit('calculate_bolus slot block not found')
          text = text.replace(slot_old, slot_new, 1)

          target_old = '        target_mgdl=target or user_settings.targets.mid,\n'
          target_new = '''        # None deliberately delegates target resolution to the authoritative\n        # engine, which honors targets.<meal_slot> before targets.mid.\n        target_mgdl=target,\n'''
          if target_old not in text:
              raise SystemExit('bot target override anchor not found')
          text = text.replace(target_old, target_new, 1)

          start = text.index('async def calculate_correction(')
          end = text.index('\n\nasync def simulate_whatif(', start)
          correction_new = '''async def calculate_correction(target_bg: Optional[float] = None) -> CorrectionResult | ToolError:\n    \"\"\"Calculate a correction through the same authoritative bolus service.\"\"\"\n    try:\n        user_settings, user_id = await resolve_bot_user_settings()\n        meal_slot = _resolve_meal_slot(user_settings)\n    except Exception as exc:\n        return ToolError(type=\"config_error\", message=f\"Config no disponible: {exc}\")\n\n    req = BolusRequestV2(\n        carbs_g=0,\n        meal_slot=meal_slot,\n        # Explicit user override is preserved; otherwise the engine resolves the\n        # target for the active meal slot.\n        target_mgdl=target_bg,\n        confirm_iob_unknown=True,\n        confirm_iob_stale=True,\n    )\n\n    try:\n        rec = await calculate_bolus_for_bot(req, username=user_id)\n    except Exception as exc:\n        return ToolError(type=\"calc_error\", message=f\"Error calculando corrección: {exc}\")\n\n    if not rec.glucose or rec.glucose.mgdl is None:\n        return ToolError(type=\"missing_data\", message=\"No hay datos de glucosa recientes.\")\n\n    explanation = list(rec.explain or [])\n    if rec.warnings:\n        explanation.extend([f\"⚠️ {warning}\" for warning in rec.warnings])\n\n    return CorrectionResult(\n        units=rec.total_u,\n        explanation=explanation,\n        confidence=\"high\",\n        quality=\"data-driven\",\n    )\n'''
          text = text[:start] + correction_new + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-bot-bolus-parity.yml
          git add backend/app/bot/tools.py
          git commit -m "Route Telegram bolus calculations through central engine"
          git push origin HEAD:fix/bot-bolus-parity
