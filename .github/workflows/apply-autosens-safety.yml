name: Apply Autosens safety fix

on:
  push:
    branches:
      - fix/bolus-autosens-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bolus-autosens-safety
          fetch-depth: 0
      - name: Patch bolus calculation service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/bolus_calc_service.py')
          text = path.read_text(encoding='utf-8')

          import_old = 'from app.services.autosens_service import AutosensService\n'
          import_new = '''from app.services.autosens_service import AutosensService\nfrom app.services.autosens_hybrid import (\n    build_compression_config,\n    combine_hybrid_autosens,\n)\n'''
          if import_old not in text:
              raise SystemExit('AutosensService import anchor not found')
          text = text.replace(import_old, import_new, 1)

          old = '''            local_ratio = 1.0\n            local_reason = ""\n            try:\n                res = await AutosensService.calculate_autosens(\n                    username=user.username,\n                    session=session,\n                    settings=user_settings,\n                    record_run=persist_autosens_run,\n                    compression_config=compression_config,\n                )\n                local_ratio = res.ratio\n                if local_ratio != 1.0:\n                    local_reason = f" + Local {res.reason}"\n            except Exception:\n                pass\n\n            # Calculate hybrid ratio\n            raw_hybrid = tdd_ratio * local_ratio\n            autosens_ratio = max(\n                user_settings.autosens.min_ratio,\n                min(user_settings.autosens.max_ratio, raw_hybrid),\n            )\n\n            # Build detailed reason string\n            autosens_reason = (\n                f"Híbrido: TDD {tdd_ratio:.2f}x * Local {local_ratio:.2f}x"\n            )\n'''
          new = '''            compression_config = build_compression_config(user_settings)\n            local_ratio = 1.0\n            local_reason_flags = []\n            local_error = None\n            try:\n                res = await AutosensService.calculate_autosens(\n                    username=user.username,\n                    session=session,\n                    settings=user_settings,\n                    record_run=persist_autosens_run,\n                    compression_config=compression_config,\n                )\n                local_ratio = res.ratio\n                local_reason_flags = list(res.reason_flags or [])\n            except Exception as exc:\n                local_error = f"{type(exc).__name__}: {exc}"\n                logger.exception(\n                    "Local Autosens failed; neutralizing hybrid dynamic dosing"\n                )\n\n            decision = combine_hybrid_autosens(\n                tdd_ratio=tdd_ratio,\n                local_ratio=local_ratio,\n                min_ratio=user_settings.autosens.min_ratio,\n                max_ratio=user_settings.autosens.max_ratio,\n                local_reason_flags=local_reason_flags,\n                local_error=local_error,\n            )\n            raw_hybrid = decision.raw_ratio\n            autosens_ratio = decision.ratio\n            autosens_reason = decision.reason\n'''
          if old not in text:
              raise SystemExit('Expected legacy hybrid Autosens block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-autosens-safety.yml
          git add backend/app/services/bolus_calc_service.py
          git commit -m "Fix hybrid Autosens execution and guardrails"
          git push origin HEAD:fix/bolus-autosens-safety
