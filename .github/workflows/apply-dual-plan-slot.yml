name: Apply dual plan meal slot

on:
  push:
    branches:
      - fix/dual-plan-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dual-plan-persistence
          fetch-depth: 0
      - name: Preserve meal slot in active dual plan
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('frontend/src/pages/BolusPage.jsx')
          text = page.read_text(encoding='utf-8')
          old = '''            date, nsConfig, alcoholEnabled,\n            carbProfile,\n            plateItems\n'''
          new = '''            date, nsConfig, alcoholEnabled,\n            carbProfile,\n            plateItems,\n            mealSlot: slot\n'''
          if old not in text:
              raise SystemExit('BolusPage save slot anchor not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')

          hook = Path('frontend/src/hooks/useBolusCalculator.js')
          text = hook.read_text(encoding='utf-8')
          old = '''            date, nsConfig,\n            alcoholEnabled, carbProfile,\n            plateItems\n'''
          new = '''            date, nsConfig,\n            alcoholEnabled, carbProfile,\n            plateItems, mealSlot\n'''
          if old not in text:
              raise SystemExit('hook save params slot anchor not found')
          text = text.replace(old, new, 1)
          old = "                mealSlot: result?.calc?.used_params?.meal_slot || null,\n"
          new = "                mealSlot: mealSlot || null,\n"
          if old not in text:
              raise SystemExit('persistent plan meal slot anchor not found')
          hook.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dual-plan-slot.yml
          git add frontend/src/pages/BolusPage.jsx frontend/src/hooks/useBolusCalculator.js
          git commit -m "Preserve meal slot in active dual plans"
          git push origin HEAD:fix/dual-plan-persistence
