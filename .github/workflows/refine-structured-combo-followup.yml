name: Refine structured combo followup

on:
  push:
    branches:
      - fix/structured-combo-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-combo-followup
          fetch-depth: 0
      - name: Remove ambiguous registration wording and harden plan parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/bot/llm/router.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'f"Toca la 2ª parte del bolo ({units} U), pero estás en **{bg} mg/dL** y bajando ({delta}).\\n"',
              'f"El plan original deja **{units} U** pendientes, pero estás en **{bg} mg/dL** y bajando ({delta}).\\n"',
              1,
          )
          text = text.replace(
              'f"Faltan unos minutos para la 2ª parte ({units} U), pero ya estás subiendo (**{bg}** {trend}).\\n"\n                f"¿Quieres adelantar el registro ahora?"',
              'f"El plan original deja **{units} U** pendientes y ya estás subiendo (**{bg}** {trend}).\\n"\n                f"¿Quieres revisar el plan ahora?"',
              1,
          )
          text = text.replace(
              'f"Es hora de la 2ª parte. Estás en **{bg or \'?\'}** {trend}.\\n"\n                f"¿Registramos?"',
              'f"Ha llegado la hora prevista para revisar la 2ª parte. Estás en **{bg or \'?\'}** {trend}.\\n"\n                f"¿Revisamos el plan?"',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('backend/app/bot/proactive.py')
          text = path.read_text(encoding='utf-8')
          old = '''    pending_structured = [\n        plan for plan in active_plans\n        if plan.get("status", "pending") == "pending"\n        and float(plan.get("later_u_planned") or 0) > 0\n    ]\n'''
          new = '''    pending_structured = []\n    for plan in active_plans:\n        if plan.get("status", "pending") != "pending":\n            continue\n        try:\n            later_u = float(plan.get("later_u_planned") or 0)\n        except (TypeError, ValueError):\n            continue\n        if later_u > 0:\n            pending_structured.append(plan)\n'''
          if old not in text:
              raise SystemExit('pending structured plan block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-structured-combo-followup.yml
          git add backend/app/bot/llm/router.py backend/app/bot/proactive.py
          git commit -m "Harden structured combo review messaging"
          git push origin HEAD:fix/structured-combo-followup
