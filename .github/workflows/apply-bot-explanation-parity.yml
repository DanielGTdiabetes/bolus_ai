name: Apply bot bolus explanation parity

on:
  push:
    branches:
      - fix/bot-bolus-explanation-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-bolus-explanation-parity
          fetch-depth: 0
      - name: Patch bot bolus explanation and target resolution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/bot/service.py')
          text = path.read_text(encoding='utf-8')

          old_iob = '''    if rec.iob_u > 0:\n        lines.append(f"- IOB: −{rec.iob_u:.2f} U")\n    else:\n        lines.append("- IOB: −0.0 U")\n\n    starting = rec.meal_bolus_u + rec.correction_u - rec.iob_u\n    if starting < 0:\n        starting = 0\n    diff = rec.total_u_final - starting\n    if abs(diff) > 0.01:\n        sign = "+" if diff > 0 else ""\n        lines.append(f"- Ajuste/Redondeo: {sign}{diff:.2f} U")\n'''
          new_iob = '''    positive_correction = max(rec.correction_u, 0.0)\n    iob_applied = min(positive_correction, max(rec.iob_u, 0.0))\n    correction_remaining = max(positive_correction - iob_applied, 0.0)\n    if rec.iob_u > 0:\n        lines.append(\n            f"- IOB activo: {rec.iob_u:.2f} U "\n            f"(aplicado a corrección: {iob_applied:.2f} U; "\n            f"corrección restante: {correction_remaining:.2f} U)"\n        )\n    else:\n        lines.append("- IOB activo: 0.00 U")\n'''
          if old_iob not in text:
              raise SystemExit('legacy bot IOB explanation block not found')
          text = text.replace(old_iob, new_iob, 1)

          old_target = '''    req_v2 = BolusRequestV2(\n        carbs_g=carbs,\n        target_mgdl=user_settings.targets.mid, # Default\n        meal_slot=slot,\n'''
          new_target = '''    req_v2 = BolusRequestV2(\n        carbs_g=carbs,\n        # Target is resolved centrally from targets.<meal_slot>.\n        meal_slot=slot,\n'''
          if old_target not in text:
              raise SystemExit('agent bolus target override block not found')
          text = text.replace(old_target, new_target, 1)

          old_fallback = '''        req_v2 = BolusRequestV2(\n            carbs_g=snapshot.get("carbs", 0.0),\n            fat_g=snapshot.get("fat", 0.0),\n            protein_g=snapshot.get("protein", 0.0),\n            fiber_g=snapshot.get("fiber", 0.0),\n            meal_slot=get_current_meal_slot(user_settings),\n            target_mgdl=user_settings.targets.mid,\n        )\n'''
          new_fallback = '''        req_v2 = BolusRequestV2(\n            carbs_g=snapshot.get("carbs", 0.0),\n            fat_g=snapshot.get("fat", 0.0),\n            protein_g=snapshot.get("protein", 0.0),\n            fiber_g=snapshot.get("fiber", 0.0),\n            meal_slot=get_current_meal_slot(user_settings),\n        )\n'''
          if old_fallback not in text:
              raise SystemExit('exercise fallback target override block not found')
          text = text.replace(old_fallback, new_fallback, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-bot-explanation-parity.yml
          git add backend/app/bot/service.py
          git commit -m "Align Telegram bolus explanation with central engine"
          git push origin HEAD:fix/bot-bolus-explanation-parity
