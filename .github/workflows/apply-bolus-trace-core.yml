name: Apply bolus trace core fields

on:
  push:
    branches:
      - fix/bolus-calculation-traceability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bolus-calculation-traceability
          fetch-depth: 0
      - name: Add effective parameters to trace output
        run: |
          python - <<'PY'
          from pathlib import Path

          # DTO: expose effective values produced by the core without changing math.
          path = Path('backend/app/dtos/math_models.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Components\n    meal_u: float = 0.0\n    corr_u: float = 0.0\n    iob_devoured: float = 0.0\n    \n    # Split\n'''
          new = '''    # Components\n    meal_u: float = 0.0\n    corr_u: float = 0.0\n    iob_devoured: float = 0.0\n    effective_cr: float = 0.0\n    effective_isf: float = 0.0\n    \n    # Split\n'''
          if old not in text:
              raise SystemExit('CalculationResult anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # API model: trace-only fields, backwards compatible.
          path = Path('backend/app/models/bolus_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '''    isf_base: Optional[float] = None\n    autosens_ratio: float = 1.0\n    autosens_reason: Optional[str] = None\n    config_hash: Optional[str] = None\n'''
          new = '''    isf_base: Optional[float] = None\n    effective_cr_g_per_u: Optional[float] = None\n    effective_isf_mgdl_per_u: Optional[float] = None\n    round_step_u: Optional[float] = None\n    max_correction_u: Optional[float] = None\n    max_iob_u: Optional[float] = None\n    min_bolus_interval_min: Optional[int] = None\n    techne_enabled: Optional[bool] = None\n    techne_max_step_change: Optional[float] = None\n    autosens_ratio: float = 1.0\n    autosens_reason: Optional[str] = None\n    config_hash: Optional[str] = None\n'''
          if old not in text:
              raise SystemExit('UsedParams anchor not found')
          text = text.replace(old, new, 1)

          old_resp = '''    correction_u: float\n    iob_u: float\n    total_u_raw: float\n'''
          new_resp = '''    correction_u: float\n    iob_u: float\n    iob_applied_to_correction_u: float = 0.0\n    total_u_raw: float\n'''
          if old_resp not in text:
              raise SystemExit('BolusResponse component anchor not found')
          path.write_text(text.replace(old_resp, new_resp, 1), encoding='utf-8')

          # Engine: return values already used internally; no dosing formula changes.
          path = Path('backend/app/services/bolus_engine.py')
          text = path.read_text(encoding='utf-8')
          old_return = '''    return CalculationResult(\n        total_u=final_total,\n        meal_u=meal_u, # This includes simple warsaw\n        corr_u=corr_u,\n        breakdown=explain,\n        warnings=warnings,\n        upfront_u=final_upfront,\n        later_u=final_later,\n        duration_min=duration_min\n    )\n'''
          new_return = '''    return CalculationResult(\n        total_u=final_total,\n        meal_u=meal_u, # This includes simple warsaw\n        corr_u=corr_u,\n        iob_devoured=iob_applied_to_correction,\n        effective_cr=cr,\n        effective_isf=isf,\n        breakdown=explain,\n        warnings=warnings,\n        upfront_u=final_upfront,\n        later_u=final_later,\n        duration_min=duration_min\n    )\n'''
          if old_return not in text:
              raise SystemExit('CalculationResult construction anchor not found')
          text = text.replace(old_return, new_return, 1)

          old_used = '''        isf_base=isf_base,\n        autosens_ratio=autosens_ratio,\n        autosens_reason=autosens_reason,\n        config_hash=settings.config_hash\n    )\n'''
          new_used = '''        isf_base=isf_base,\n        effective_cr_g_per_u=round(res.effective_cr, 3),\n        effective_isf_mgdl_per_u=round(res.effective_isf, 3),\n        round_step_u=settings.round_step_u,\n        max_correction_u=settings.max_correction_u,\n        max_iob_u=getattr(settings, 'max_iob_u', None),\n        min_bolus_interval_min=getattr(settings, 'min_bolus_interval_min', 0),\n        techne_enabled=settings.techne.enabled,\n        techne_max_step_change=settings.techne.max_step_change,\n        autosens_ratio=autosens_ratio,\n        autosens_reason=autosens_reason,\n        config_hash=settings.config_hash\n    )\n'''
          if old_used not in text:
              raise SystemExit('UsedParams construction anchor not found')
          text = text.replace(old_used, new_used, 1)

          old_response = '''        correction_u=round(res.corr_u, 2),\n        total_u_raw=round(res.meal_u + res.corr_u, 2), # Approx\n'''
          new_response = '''        correction_u=round(res.corr_u, 2),\n        iob_applied_to_correction_u=round(res.iob_devoured, 2),\n        total_u_raw=round(res.meal_u + res.corr_u, 2), # Approx\n'''
          if old_response not in text:
              raise SystemExit('BolusResponse construction anchor not found')
          path.write_text(text.replace(old_response, new_response, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-bolus-trace-core.yml
          git add backend/app/dtos/math_models.py backend/app/models/bolus_v2.py backend/app/services/bolus_engine.py
          git commit -m "Expose effective bolus parameters for traceability"
          git push origin HEAD:fix/bolus-calculation-traceability
