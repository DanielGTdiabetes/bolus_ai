name: Apply IOB UI allocation copy
on:
  push:
    branches: [fix/iob-ui-allocation-copy]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iob-ui-allocation-copy
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/BolusPage.jsx')
          s = p.read_text(encoding='utf-8')
          old = '<div style={{ fontSize: \'0.8rem\', color: \'#60a5fa\' }}>Se restará del bolo</div>'
          new = '<div style={{ fontSize: \'0.8rem\', color: \'#60a5fa\' }}>Protege frente a correcciones apiladas; no descuenta HC nuevos</div>'
          if old not in s:
              raise SystemExit('IOB copy anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-iob-ui-copy.yml
          git add frontend/src/pages/BolusPage.jsx
          git commit -m "Clarify IOB allocation in bolus UI"
          git push origin HEAD:fix/iob-ui-allocation-copy
