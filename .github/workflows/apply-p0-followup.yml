name: Apply P0 follow-up fixes

on:
  push:
    branches:
      - fix/bolus-calculator-p0-safety-rebased

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bolus-calculator-p0-safety-rebased
          fetch-depth: 0
      - name: Apply minimal implementation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          iob_path = Path('backend/app/services/iob.py')
          text = iob_path.read_text(encoding='utf-8')
          old = '''            params = {"cutoff": cutoff}\n            user_filter = ""\n            if user_id:\n                user_filter = "AND user_id = :user_id"\n                params["user_id"] = user_id\n'''
          new = '''            # Never query treatments across all users when caller identity is absent.\n            # A missing user_id intentionally matches no DB rows; local event sources\n            # can still provide IOB for legacy/offline callers.\n            params = {"cutoff": cutoff, "user_id": user_id or "__bolus_ai_no_user__"}\n            user_filter = "AND user_id = :user_id"\n'''
          if old not in text:
              raise SystemExit('Expected IOB user filter block not found')
          iob_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          logger_path = Path('backend/app/services/treatment_logger.py')
          text = logger_path.read_text(encoding='utf-8')
          import_old = 'from sqlalchemy.ext.asyncio import AsyncSession\n'
          import_new = 'from sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n'
          if import_old not in text:
              raise SystemExit('Expected AsyncSession import not found')
          text = text.replace(import_old, import_new, 1)

          get_old = '            db_treatment = await active_session.get(Treatment, treatment_id)\n'
          get_new = '''            existing_result = await active_session.execute(\n                select(Treatment).where(Treatment.id == treatment_id)\n            )\n            db_treatment = existing_result.scalars().first()\n'''
          if get_old not in text:
              raise SystemExit('Expected session.get treatment lookup not found')
          logger_path.write_text(text.replace(get_old, get_new, 1), encoding='utf-8')
          PY
      - name: Commit implementation fixes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-p0-followup.yml
          git add backend/app/services/iob.py backend/app/services/treatment_logger.py
          git commit -m "Fix IOB user isolation and treatment persistence compatibility"
          git push origin HEAD:fix/bolus-calculator-p0-safety-rebased
