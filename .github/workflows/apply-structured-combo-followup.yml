name: Apply structured combo followup

on:
  push:
    branches:
      - fix/structured-combo-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-combo-followup
          fetch-depth: 0
      - name: Prefer structured active plans for combo followup
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- proactive.py ----------
          path = Path('backend/app/bot/proactive.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from app.services.autosens_service import AutosensService\n'
          if import_anchor not in text:
              raise SystemExit('proactive import anchor not found')
          text = text.replace(
              import_anchor,
              import_anchor + 'from app.services.active_plan_store import load_active_plans, select_due_active_plan\n',
              1,
          )

          fetch_anchor = '''    # 4. Fetch Treatments\n    treatments = []\n'''
          structured_block = '''    # 4. Prefer the structured active dual plan. This is the authoritative\n    # source for the planned later amount; treatment-note parsing below is only\n    # a legacy fallback for historical entries.\n    store = DataStore(Path(global_settings.data.data_dir))\n    events = store.load_events()\n    active_plans = load_active_plans(store)\n    pending_structured = [\n        plan for plan in active_plans\n        if plan.get("status", "pending") == "pending"\n        and float(plan.get("later_u_planned") or 0) > 0\n    ]\n    if pending_structured:\n        now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)\n        due_plan = select_due_active_plan(pending_structured, now_ms=now_ms)\n        if due_plan is None:\n            record_proactive_status("combo", False, "structured_plan_not_due")\n            return\n\n        created_raw = int(due_plan.get("created_at_ts") or 0)\n        if 0 < created_raw < 10_000_000_000:\n            created_raw *= 1000\n        plan_created = datetime.fromtimestamp(created_raw / 1000, tz=timezone.utc)\n        diff_min = max(0, int((datetime.now(timezone.utc) - plan_created).total_seconds() / 60))\n\n        status_res = await tools.execute_tool("get_status_context", {})\n        payload = {\n            "reason_hint": "eligible_candidate",\n            "structured_plan": True,\n            "plan_id": due_plan.get("plan_id") or due_plan.get("id"),\n            "treatment_id": due_plan.get("treatment_id") or due_plan.get("id"),\n            "planned_later_u": due_plan.get("later_u_planned"),\n            "upfront_u": due_plan.get("upfront_u"),\n            "total_recommended_u": due_plan.get("total_recommended_u"),\n            "meal_slot": due_plan.get("meal_slot"),\n            "source": due_plan.get("source"),\n            "bolus_at": plan_created.isoformat(),\n            "minutes_since": diff_min,\n            "delay_minutes": due_plan.get("later_after_min"),\n            "bg": getattr(status_res, "bg_mgdl", None),\n            "trend": getattr(status_res, "direction", "Flat"),\n            "delta": getattr(status_res, "delta_mgdl", 0),\n            "iob": getattr(status_res, "iob_u", None),\n        }\n        await _route(payload)\n        return\n\n    # 5. Legacy fallback: infer old duals from treatment notes.\n    # Never treat the first recorded insulin amount as a known second tranche.\n    treatments = []\n'''
          if fetch_anchor not in text:
              raise SystemExit('proactive treatment fetch anchor not found')
          text = text.replace(fetch_anchor, structured_block, 1)

          # Existing legacy fallback recreates store/events later; harmless but redundant.
          path.write_text(text, encoding='utf-8')

          # ---------- router.py ----------
          path = Path('backend/app/bot/llm/router.py')
          text = path.read_text(encoding='utf-8')
          combo_anchor = '''    if event_type == "combo_followup":\n        tid = payload.get("treatment_id", "unknown")\n        bolus_at = payload.get("bolus_at", "?")\n        units = payload.get("bolus_units", "?")\n        \n        # Context\n'''
          combo_replacement = '''    if event_type == "combo_followup":\n        tid = payload.get("treatment_id", "unknown")\n        plan_id = payload.get("plan_id") or tid\n        bolus_at = payload.get("bolus_at", "?")\n        planned_later = payload.get("planned_later_u")\n\n        # Historical heuristic entries do not contain a trustworthy second\n        # tranche amount. Never relabel the first bolus as the second dose.\n        if planned_later is None:\n            text = (\n                "🔄 **Seguimiento de bolo dual antiguo**\\n\\n"\n                "He detectado un bolo dual histórico, pero no existe un plan "\n                "estructurado con la cantidad pendiente. No voy a asumir que "\n                "la dosis inicial sea la 2ª parte.\\n\\n"\n                "Revisa el estado actual antes de decidir cualquier dosis."\n            )\n            buttons = [\n                [InlineKeyboardButton("📊 Ver estado", callback_data="run_cmd|status")],\n                [InlineKeyboardButton("❌ Cerrar aviso", callback_data=f"combo_no|{tid}")],\n            ]\n            health.record_event(event_type, True, "sent_combo_legacy_no_plan")\n            rules.mark_event_sent(event_type)\n            return BotReply(text=text, buttons=buttons)\n\n        units = float(planned_later)\n        \n        # Context\n'''
          if combo_anchor not in text:
              raise SystemExit('router combo anchor not found')
          text = text.replace(combo_anchor, combo_replacement, 1)

          text = text.replace(
              'InlineKeyboardButton("💉 Registrar AHORA", callback_data=f"combo_yes|{tid}")',
              'InlineKeyboardButton("🔎 Revisar ahora", callback_data=f"combo_review|{plan_id}")',
              1,
          )
          text = text.replace(
              'InlineKeyboardButton("⏰ Esperar", callback_data=f"combo_later|{tid}")',
              'InlineKeyboardButton("⏰ Esperar", callback_data=f"combo_later|{plan_id}")',
              1,
          )
          text = text.replace(
              'f"Detectado bolo de **{units} U** a las {time_str}.\\n"',
              'f"Plan pendiente original: **{units} U** (bolo inicial a las {time_str}).\\n"',
              1,
          )
          text = text.replace(
              'InlineKeyboardButton("💉 Registrar 2ª parte", callback_data=f"combo_yes|{tid}")',
              'InlineKeyboardButton("🔎 Revisar 2ª parte", callback_data=f"combo_review|{plan_id}")',
              1,
          )
          text = text.replace(
              'InlineKeyboardButton("⏰ +30 min", callback_data=f"combo_later|{tid}"), \n                 InlineKeyboardButton("❌ No", callback_data=f"combo_no|{tid}")',
              'InlineKeyboardButton("⏰ +30 min", callback_data=f"combo_later|{plan_id}"), \n                 InlineKeyboardButton("❌ Cancelar plan", callback_data=f"combo_no|{plan_id}")',
              1,
          )
          text = text.replace(
              'InlineKeyboardButton("⏰ Posponer 30m", callback_data=f"combo_later|{tid}")],\n                [InlineKeyboardButton("❌ Cancelar dosis", callback_data=f"combo_no|{tid}")]',
              'InlineKeyboardButton("⏰ Posponer 30m", callback_data=f"combo_later|{plan_id}")],\n                [InlineKeyboardButton("❌ Cancelar plan", callback_data=f"combo_no|{plan_id}")]',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # ---------- service.py callbacks ----------
          path = Path('backend/app/bot/service.py')
          text = path.read_text(encoding='utf-8')
          old_combo = '''    # --- 3. Combo Followup ---\n    if data.startswith("combo_"):\n        # combo_yes|tid, combo_later|tid, combo_no|tid\n        parts = data.split("|")\n        action = parts[0]\n        tid = parts[1] if len(parts) > 1 else "unknown"\n        \n        if action == "combo_yes":\n             # Trigger logic to add remaining part? \n             # For now, just prompt user or log. User asked to "Registrar 2a parte".\n             # We assume manual entry or simplified addition.\n             await edit_message_text_safe(query, "✅ Anotado. (Funcionalidad completa en vNext)")\n             health.record_action(f"callback:combo_yes:{tid}", True)\n             \n        elif action == "combo_later":\n             # Snooze\n             await edit_message_text_safe(query, "⏳ Pospuesto 30 min.")\n             health.record_action(f"callback:combo_later:{tid}", True)\n             \n        elif action == "combo_no":\n             await edit_message_text_safe(query, "❌ Descartado.")\n             health.record_action(f"callback:combo_no:{tid}", True)\n             health.record_action(f"callback:combo_no:{tid}", True)\n        return\n'''
          new_combo = '''    # --- 3. Combo Followup ---\n    if data.startswith("combo_"):\n        # Structured plans use plan_id. Historical messages may still carry a\n        # treatment id; the store helper accepts either identifier.\n        parts = data.split("|")\n        action = parts[0]\n        identifier = parts[1] if len(parts) > 1 else "unknown"\n        settings = get_settings()\n        plan_store = DataStore(Path(settings.data.data_dir))\n        from app.services.active_plan_store import find_active_plan, update_active_plan\n\n        if action == "combo_review":\n             plan = find_active_plan(plan_store, identifier)\n             if not plan:\n                 await edit_message_text_safe(query, "⚠️ No encuentro el plan activo. Revisa el cálculo desde la app.")\n                 health.record_action(f"callback:combo_review:{identifier}", False, "plan_missing")\n                 return\n\n             status_res = await tools.execute_tool("get_status_context", {})\n             bg = getattr(status_res, "bg_mgdl", None)\n             trend = getattr(status_res, "direction", None)\n             iob = getattr(status_res, "iob_u", None)\n             planned = float(plan.get("later_u_planned") or 0)\n             slot = plan.get("meal_slot") or "?"\n             review_text = (\n                 f"🔎 **Revisión del plan dual**\\n\\n"\n                 f"Pendiente original: **{planned:g} U**\\n"\n                 f"Franja: **{slot}**\\n"\n                 f"Glucosa actual: **{bg if bg is not None else '?'}** {trend or ''}\\n"\n                 f"IOB actual: **{iob if iob is not None else '?'} U**\\n\\n"\n                 "Esto es el plan original, no una nueva recomendación. "\n                 "No he registrado ni administrado insulina. Recalcula antes de decidir la dosis final."\n             )\n             buttons = [\n                 [InlineKeyboardButton("⏰ +30 min", callback_data=f"combo_later|{identifier}")],\n                 [InlineKeyboardButton("❌ Cancelar plan", callback_data=f"combo_no|{identifier}")],\n             ]\n             await edit_message_text_safe(query, review_text, parse_mode="Markdown", reply_markup=InlineKeyboardMarkup(buttons))\n             health.record_action(f"callback:combo_review:{identifier}", True)\n\n        elif action == "combo_later":\n             snooze_until = int((time.time() + 30 * 60) * 1000)\n             updated = update_active_plan(plan_store, identifier, snooze_until_ts=snooze_until)\n             if updated:\n                 await edit_message_text_safe(query, "⏳ Plan pospuesto 30 min. No se ha registrado insulina.")\n                 health.record_action(f"callback:combo_later:{identifier}", True)\n             else:\n                 await edit_message_text_safe(query, "⏳ Aviso cerrado. El plan estructurado ya no está disponible.")\n                 health.record_action(f"callback:combo_later:{identifier}", False, "plan_missing")\n\n        elif action == "combo_no":\n             updated = update_active_plan(plan_store, identifier, status="cancelled")\n             await edit_message_text_safe(query, "❌ Plan cancelado. No se ha registrado insulina.")\n             health.record_action(f"callback:combo_no:{identifier}", bool(updated), None if updated else "plan_missing")\n\n        elif action == "combo_yes":\n             # Backward compatibility for already-sent old keyboards. Never claim\n             # that a dose was recorded when no treatment write occurred.\n             await edit_message_text_safe(\n                 query,\n                 "⚠️ Este botón antiguo no registra insulina. Abre/recalcula el plan antes de decidir la 2ª parte.",\n             )\n             health.record_action(f"callback:combo_yes_legacy:{identifier}", True)\n        return\n'''
          if old_combo not in text:
              raise SystemExit('service combo callback block not found')
          path.write_text(text.replace(old_combo, new_combo, 1), encoding='utf-8')

          # ---------- ActivePlan schema ----------
          path = Path('backend/app/api/bolus.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    total_recommended_u: Optional[float] = None\n    status: Literal["pending", "completed", "cancelled"] = "pending"\n'
          replacement = '    total_recommended_u: Optional[float] = None\n    snooze_until_ts: Optional[int] = None\n    last_prompted_at_ts: Optional[int] = None\n    status: Literal["pending", "completed", "cancelled"] = "pending"\n'
          if anchor not in text:
              raise SystemExit('ActivePlan snooze schema anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-structured-combo-followup.yml
          git add backend/app/bot/proactive.py backend/app/bot/llm/router.py backend/app/bot/service.py backend/app/api/bolus.py
          git commit -m "Use structured plans for dual bolus follow-up"
          git push origin HEAD:fix/structured-combo-followup
