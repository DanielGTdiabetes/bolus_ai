name: Apply dual plan persistence

on:
  push:
    branches:
      - fix/dual-plan-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dual-plan-persistence
          fetch-depth: 0
      - name: Normalize dual plan persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          # Frontend hook
          path = Path('frontend/src/hooks/useBolusCalculator.js')
          text = path.read_text(encoding='utf-8')
          anchor = "import { buildClientBolusTrace } from '../lib/bolusTrace';\n"
          if anchor not in text:
              raise SystemExit('dual plan import anchor not found')
          text = text.replace(
              anchor,
              anchor + "import { buildPersistentDualPlan, getAuthoritativeBolusTotal } from '../lib/dualPlan';\n",
              1,
          )

          old_id = '''            const glucoseValue = parseFloat(glucose);\n\n            const treatment = {\n                treatment_id: globalThis.crypto?.randomUUID?.()\n                    ?? `bolus-${Date.now()}-${Math.random().toString(16).slice(2)}`,\n'''
          new_id = '''            const glucoseValue = parseFloat(glucose);\n            const treatmentId = globalThis.crypto?.randomUUID?.()\n                ?? `bolus-${Date.now()}-${Math.random().toString(16).slice(2)}`;\n            const isDualResult = result.kind === 'dual' || result.kind === 'extended';\n            const totalRecommendedU = getAuthoritativeBolusTotal(result);\n            const persistentDualPlan = isDualResult ? buildPersistentDualPlan({\n                result,\n                treatmentId,\n                acceptedUpfrontU: finalInsulin,\n                createdAtTs: Date.now(),\n                mealSlot: result?.calc?.used_params?.meal_slot || null,\n                source: result?.plan ? 'app-manual-split' : 'app-engine-split',\n            }) : null;\n\n            const treatment = {\n                treatment_id: treatmentId,\n'''
          if old_id not in text:
              raise SystemExit('treatment id anchor not found')
          text = text.replace(old_id, new_id, 1)

          text = text.replace(
              "notes: `BolusAI: ${(result.kind === 'dual' || result.kind === 'extended') ? 'Dual' : 'Normal'}.",
              "notes: `BolusAI: ${isDualResult ? 'Dual' : 'Normal'}.",
              1,
          )

          old_strategy = '''                const strategy = (result.kind === 'dual' || result.kind === 'extended') ? {\n                    kind: 'dual',\n                    total: result.total_u_final,\n                    upfront: result.upfront_u,\n                    later: result.later_u,\n                    delay: result.duration_min\n                } : { kind: 'normal', total: result.total_u_final };\n'''
          new_strategy = '''                const strategy = persistentDualPlan ? {\n                    kind: 'dual',\n                    total: totalRecommendedU,\n                    upfront: persistentDualPlan.upfront_u,\n                    later: persistentDualPlan.later_u_planned,\n                    delay: persistentDualPlan.later_after_min,\n                    plan_id: persistentDualPlan.plan_id,\n                    treatment_id: treatmentId,\n                } : { kind: 'normal', total: totalRecommendedU };\n'''
          if old_strategy not in text:
              raise SystemExit('learning strategy anchor not found')
          text = text.replace(old_strategy, new_strategy, 1)

          old_dual = '''            // Dual Plan State Update\n            if (result.kind === 'dual' || result.kind === 'extended') {\n                treatment.notes += ` (Split: ${finalInsulin} now + ${result.later_u} delayed ${result.duration_min}m)`;\n                state.lastBolusPlan = {\n                    ...result.plan,\n                    upfront_u: finalInsulin,\n                    created_at_ts: Date.now()\n                };\n                saveDualPlan(state.lastBolusPlan);\n\n                // --- SYNC TO BOT ENDPOINT ---\n                try {\n                    // We need to map to ActivePlan Schema\n                    // result.plan usually has: { now_u, later_u_planned, later_after_min, extended_duration_min, total_recommended_u }\n                    await saveActivePlan({\n                        id: result.plan.plan_id || String(Date.now()),\n                        created_at_ts: Date.now(),\n                        upfront_u: finalInsulin,\n                        later_u_planned: result.later_u, // from result top level which is already calculated/overwritten\n                        later_after_min: result.duration_min, // usually same as duration\n                        extended_duration_min: result.duration_min,\n                        notes: `Origen: App (${foodName || 'Manual'})`,\n                        status: "pending"\n                    });\n                } catch (errPlan) {\n                    console.warn("Failed to sync plan to bot:", errPlan);\n                }\n            }\n'''
          new_dual = '''            // Add the plan description to the treatment, but do not mark the\n            // plan active until the treatment itself has been persisted.\n            if (persistentDualPlan) {\n                treatment.notes += ` (Split: ${persistentDualPlan.upfront_u} now + ${persistentDualPlan.later_u_planned} delayed ${persistentDualPlan.later_after_min}m)`;\n            }\n'''
          if old_dual not in text:
              raise SystemExit('legacy dual persistence block not found')
          text = text.replace(old_dual, new_dual, 1)

          save_anchor = '''            const apiRes = await saveTreatment(treatment);\n\n            // Needle Stock\n'''
          save_replacement = '''            const apiRes = await saveTreatment(treatment);\n\n            // Activate/sync the plan only after treatment persistence succeeded.\n            if (persistentDualPlan && apiRes?.success !== false) {\n                state.lastBolusPlan = persistentDualPlan;\n                saveDualPlan(persistentDualPlan);\n                try {\n                    await saveActivePlan({\n                        ...persistentDualPlan,\n                        notes: `Origen: App (${foodName || 'Manual'})`,\n                    });\n                } catch (errPlan) {\n                    console.warn("Failed to sync plan to bot:", errPlan);\n                }\n            }\n\n            // Needle Stock\n'''
          if save_anchor not in text:
              raise SystemExit('post-treatment plan persistence anchor not found')
          path.write_text(text.replace(save_anchor, save_replacement, 1), encoding='utf-8')

          # Backend active plan schema: retain the richer normalized shape.
          path = Path('backend/app/api/bolus.py')
          text = path.read_text(encoding='utf-8')
          old_model = '''class ActivePlan(BaseModel):\n    id: str\n    created_at_ts: int\n    upfront_u: float\n    later_u_planned: float\n    later_after_min: int\n    extended_duration_min: Optional[int] = None\n    status: Literal["pending", "completed", "cancelled"] = "pending"\n    notes: Optional[str] = None\n'''
          new_model = '''class ActivePlan(BaseModel):\n    id: str\n    created_at_ts: int\n    upfront_u: float\n    later_u_planned: float\n    later_after_min: int\n    extended_duration_min: Optional[int] = None\n    treatment_id: Optional[str] = None\n    plan_id: Optional[str] = None\n    mode: Optional[Literal["manual", "dual"]] = None\n    source: Optional[str] = None\n    meal_slot: Optional[Literal["breakfast", "lunch", "dinner", "snack"]] = None\n    total_recommended_u: Optional[float] = None\n    status: Literal["pending", "completed", "cancelled"] = "pending"\n    notes: Optional[str] = None\n'''
          if old_model not in text:
              raise SystemExit('ActivePlan schema anchor not found')
          path.write_text(text.replace(old_model, new_model, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-dual-plan-persistence.yml
          git add frontend/src/hooks/useBolusCalculator.js backend/app/api/bolus.py
          git commit -m "Persist normalized dual plans after treatment save"
          git push origin HEAD:fix/dual-plan-persistence
