name: Apply meal session save integration

on:
  push:
    branches:
      - feat/meal-session-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meal-session-ui
          fetch-depth: 0
      - name: Link saved treatments to active meal sessions
        run: |
          python - <<'PY'
          from pathlib import Path

          # useBolusCalculator
          path = Path('frontend/src/hooks/useBolusCalculator.js')
          text = path.read_text(encoding='utf-8')
          import_anchor = "import { buildPersistentDualPlan, getAuthoritativeBolusTotal } from '../lib/dualPlan';\n"
          if import_anchor not in text:
              raise SystemExit('meal session save import anchor not found')
          text = text.replace(
              import_anchor,
              import_anchor + "import { addMealSessionCarbs, linkTreatmentToMealSession } from '../lib/mealSessionApi';\n",
              1,
          )

          old_destructure = '''            date, nsConfig,\n            alcoholEnabled, carbProfile,\n            plateItems, mealSlot\n'''
          new_destructure = '''            date, nsConfig,\n            alcoholEnabled, carbProfile,\n            plateItems, mealSlot,\n            mealSessionId, mealSessionPlatePayload\n'''
          if old_destructure not in text:
              raise SystemExit('save params meal session anchor not found')
          text = text.replace(old_destructure, new_destructure, 1)

          save_anchor = '''            const apiRes = await saveTreatment(treatment);\n\n            // Activate/sync the plan only after treatment persistence succeeded.\n'''
          save_replacement = '''            const apiRes = await saveTreatment(treatment);\n\n            // Long-meal ledger is deliberately post-treatment and best-effort.\n            // A ledger failure must never invalidate an already persisted bolus.\n            let mealSessionState = null;\n            let mealSessionPlateRecorded = !mealSessionPlatePayload;\n            let mealSessionLinked = false;\n            if (mealSessionId) {\n                if (mealSessionPlatePayload) {\n                    try {\n                        mealSessionState = await addMealSessionCarbs(mealSessionId, mealSessionPlatePayload);\n                        mealSessionPlateRecorded = true;\n                    } catch (sessionErr) {\n                        console.warn("Failed to record meal-session plate:", sessionErr);\n                        showToast("⚠️ Bolo guardado, pero el plato no se pudo añadir a la sesión.", "warning", 5000);\n                    }\n                }\n\n                if (apiRes?.treatment_id) {\n                    try {\n                        mealSessionState = await linkTreatmentToMealSession(mealSessionId, apiRes.treatment_id);\n                        mealSessionLinked = true;\n                    } catch (sessionErr) {\n                        console.warn("Failed to link treatment to meal session:", sessionErr);\n                        showToast("⚠️ Bolo guardado, pero no se pudo vincular a la comida larga.", "warning", 5000);\n                    }\n                }\n            }\n\n            // Activate/sync the plan only after treatment persistence succeeded.\n'''
          if save_anchor not in text:
              raise SystemExit('post treatment meal session anchor not found')
          text = text.replace(save_anchor, save_replacement, 1)

          nav_anchor = '''            setTimeout(() => navigate('#/'), 1000);\n\n        } catch (e) {\n            alert("Error guardando: " + e.message);\n        } finally {\n'''
          nav_replacement = '''            if (mealSessionId) {\n                setResult(null);\n                return {\n                    ...apiRes,\n                    meal_session: mealSessionState,\n                    meal_session_plate_recorded: mealSessionPlateRecorded,\n                    meal_session_linked: mealSessionLinked,\n                };\n            }\n\n            setTimeout(() => navigate('#/'), 1000);\n            return apiRes;\n\n        } catch (e) {\n            alert("Error guardando: " + e.message);\n            return null;\n        } finally {\n'''
          if nav_anchor not in text:
              raise SystemExit('save navigation meal session anchor not found')
          path.write_text(text.replace(nav_anchor, nav_replacement, 1), encoding='utf-8')

          # ResultView must await the parent save so the page can reset the plate
          # only after the treatment and ledger operations finish.
          path = Path('frontend/src/components/bolus/ResultView.jsx')
          text = path.read_text(encoding='utf-8')
          old = '        onSave(finalDose, injectionSite);\n'
          new = '        await onSave(finalDose, injectionSite);\n'
          if old not in text:
              raise SystemExit('ResultView onSave await anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-meal-session-save.yml
          git add frontend/src/hooks/useBolusCalculator.js frontend/src/components/bolus/ResultView.jsx
          git commit -m "Link saved boluses to long-meal sessions"
          git push origin HEAD:feat/meal-session-ui
