name: Apply bot snapshot target parity

on:
  push:
    branches:
      - fix/bot-bolus-explanation-parity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bot-bolus-explanation-parity
          fetch-depth: 0
      - name: Remove snapshot target override
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/bot/service.py')
          text = path.read_text(encoding='utf-8')
          old = '''        BolusRequestV2(\n            carbs_g=carbs,\n            meal_slot=get_current_meal_slot(user_settings),\n            target_mgdl=user_settings.targets.mid,\n            confirm_iob_unknown=True,\n            confirm_iob_stale=True,\n        ),\n'''
          new = '''        BolusRequestV2(\n            carbs_g=carbs,\n            meal_slot=get_current_meal_slot(user_settings),\n            confirm_iob_unknown=True,\n            confirm_iob_stale=True,\n        ),\n'''
          if old not in text:
              raise SystemExit('snapshot hydration target override not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-bot-snapshot-target-parity.yml
          git add backend/app/bot/service.py
          git commit -m "Use slot target when restoring bot bolus snapshots"
          git push origin HEAD:fix/bot-bolus-explanation-parity
