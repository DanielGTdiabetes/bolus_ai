name: Apply bolus trace clients

on:
  push:
    branches:
      - fix/bolus-calculation-traceability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bolus-calculation-traceability
          fetch-depth: 0
      - name: Connect app and Telegram to trace persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          # Frontend: attach the already-computed sanitized trace when saving.
          path = Path('frontend/src/hooks/useBolusCalculator.js')
          text = path.read_text(encoding='utf-8')
          import_anchor = "import { buildOnlineBolusPayload } from '../lib/onlineBolusPayload';\n"
          if import_anchor not in text:
              raise SystemExit('frontend trace import anchor not found')
          text = text.replace(
              import_anchor,
              import_anchor + "import { buildClientBolusTrace } from '../lib/bolusTrace';\n",
              1,
          )
          old = '''                nightscout: {\n                    url: nsConfig?.url || null,\n                },\n                injection_site: siteId || null\n            };\n'''
          new = '''                nightscout: {\n                    url: nsConfig?.url || null,\n                },\n                calculation_trace: buildClientBolusTrace(result, finalInsulin, 'app'),\n                injection_site: siteId || null\n            };\n'''
          if old not in text:
              raise SystemExit('frontend treatment trace anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Telegram tools accept/persist the same trace and link it to learning memory.
          path = Path('backend/app/bot/tools.py')
          text = path.read_text(encoding='utf-8')
          old_field = '''    event_type: Optional[str] = None\n    duration: Optional[float] = None\n'''
          new_field = '''    event_type: Optional[str] = None\n    duration: Optional[float] = None\n    calculation_trace: Optional[dict] = None\n'''
          if old_field not in text:
              raise SystemExit('AddTreatmentRequest trace anchor not found')
          text = text.replace(old_field, new_field, 1)

          old_logger = '''                notes=notes,\n                entered_by="TelegramBot",\n                event_type=payload.event_type or ("Correction Bolus" if carbs == 0 else "Meal Bolus"),\n'''
          new_logger = '''                notes=notes,\n                entered_by="TelegramBot",\n                calculation_trace=payload.calculation_trace,\n                event_type=payload.event_type or ("Correction Bolus" if carbs == 0 else "Meal Bolus"),\n'''
          if old_logger not in text:
              raise SystemExit('Telegram logger trace anchor not found')
          text = text.replace(old_logger, new_logger, 1)

          old_hook = '''    if result.ok:\n        # Learning Hook (Memory)\n        try:\n            from app.services.learning_service import LearningService\n            async with SessionLocal() as session:\n                ls = LearningService(session)\n\n                strategy = {\n                    "kind": "normal",\n                    "total": insulin,\n                    "upfront": insulin,\n                    "later": 0,\n                    "delay": 0,\n                }\n                # Basic user resolution\n                l_user = user_id or "admin"\n\n                # Empty context for now\n                await ls.save_meal_entry(\n                    user_id=l_user,\n                    items=[],  # Auto-generate\n                    carbs=carbs,\n                    fat=float(payload.fat or 0),\n                    protein=float(payload.protein or 0),\n                    bolus_data=strategy,\n                    context={},\n                    notes=notes,\n                    fiber=float(payload.fiber or 0),\n                )\n        except Exception as mem_e:\n            logger.warning(f"Memory save failed: {mem_e}")\n\n        try:\n'''
          new_hook = '''    if result.ok:\n        # Learning Hook (Memory): only after the treatment reached DB.\n        if result.saved_db:\n            try:\n                from app.services.learning_service import LearningService\n                async with SessionLocal() as session:\n                    ls = LearningService(session)\n\n                    strategy = {\n                        "kind": "normal",\n                        "total": insulin,\n                        "upfront": insulin,\n                        "later": 0,\n                        "delay": 0,\n                    }\n                    l_user = user_id or "admin"\n                    trace = payload.calculation_trace or {}\n\n                    await ls.save_meal_entry(\n                        user_id=l_user,\n                        items=[],  # Auto-generate\n                        carbs=carbs,\n                        fat=float(payload.fat or 0),\n                        protein=float(payload.protein or 0),\n                        bolus_data=strategy,\n                        context=trace.get("context", {}),\n                        notes=notes,\n                        fiber=float(payload.fiber or 0),\n                        prediction_snapshot=trace.get("snapshot"),\n                        applied_ratios=trace.get("applied_ratios"),\n                    )\n            except Exception as mem_e:\n                logger.warning(f"Memory save failed: {mem_e}")\n\n        try:\n'''
          if old_hook not in text:
              raise SystemExit('Telegram learning hook anchor not found')
          path.write_text(text.replace(old_hook, new_hook, 1), encoding='utf-8')

          # Telegram callback builds trace from the exact recommendation snapshot.
          path = Path('backend/app/bot/service.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from app.bot.snapshot_store import SnapshotStore\n'
          if import_anchor not in text:
              raise SystemExit('bot service trace import anchor not found')
          text = text.replace(
              import_anchor,
              import_anchor + 'from app.services.bolus_trace import build_bolus_trace\n',
              1,
          )

          old_args = '''        # Execute Action\n        add_args = {\n             "insulin": units, \n             "carbs": carbs, \n             "fat": fat, \n             "protein": protein, \n             "fiber": fiber, \n             "notes": notes, \n             "replace_id": origin_id, \n             "duration": duration\n        }\n'''
          new_args = '''        # Execute Action. Persist the exact recommendation snapshot when available.\n        calculation_trace = None\n        if isinstance(rec, BolusResponseV2):\n             trace_snapshot, trace_ratios, trace_context = build_bolus_trace(\n                 rec,\n                 accepted_u=units,\n                 source=snapshot.get("source") or "telegram",\n             )\n             calculation_trace = {\n                 "snapshot": trace_snapshot,\n                 "applied_ratios": trace_ratios,\n                 "context": trace_context,\n             }\n\n        add_args = {\n             "insulin": units, \n             "carbs": carbs, \n             "fat": fat, \n             "protein": protein, \n             "fiber": fiber, \n             "notes": notes, \n             "replace_id": origin_id, \n             "duration": duration,\n             "calculation_trace": calculation_trace,\n        }\n'''
          if old_args not in text:
              raise SystemExit('Telegram callback add_args anchor not found')
          text = text.replace(old_args, new_args, 1)

          # Proactive MFP/nutrition path must also delegate target to the meal slot.
          old_target = '''        meal_slot=slot,\n        bg_mgdl=bg_val,\n        target_mgdl=user_settings.targets.mid,\n        confirm_iob_unknown=True,\n'''
          new_target = '''        meal_slot=slot,\n        bg_mgdl=bg_val,\n        confirm_iob_unknown=True,\n'''
          if old_target not in text:
              raise SystemExit('proactive target override anchor not found')
          path.write_text(text.replace(old_target, new_target, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-bolus-trace-clients.yml
          git add frontend/src/hooks/useBolusCalculator.js backend/app/bot/tools.py backend/app/bot/service.py
          git commit -m "Persist bolus traces from app and Telegram"
          git push origin HEAD:fix/bolus-calculation-traceability
